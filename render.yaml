services:
  - type: web
    name: forgotten-network
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build
    startCommand: node server/migrate.js && node server/index.js
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: VITE_WORLD_MODE
        value: remote
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: forgotten-network-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: 'false'
      - key: MIGRATE_ON_START
        value: 'true'
      - key: SESSION_SECRET
        generateValue: true
      - key: REQUEST_LOGS
        value: 'true'
databases:
  - name: forgotten-network-db
    plan: free
    region: frankfurt
    databaseName: forgotten_network
