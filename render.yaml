# Review paid plans before creating this Blueprint. No resources are created locally.
services:
  - type: web
    name: forgotten-network
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm run build
    preDeployCommand: node server/migrate.js
    startCommand: node server/index.js
    healthCheckPath: /api/v1/health/ready
    disk:
      name: permanent-canvas
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: PERMANENT_DB_PATH
        value: /var/data/permanent.sqlite
      - key: NODE_ENV
        value: production
      - key: VITE_WORLD_MODE
        value: remote
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: forgotten-network-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'false'
      - key: MIGRATE_ON_START
        value: 'false'
      - key: SESSION_SECRET
        generateValue: true
      - key: REQUEST_LOGS
        value: 'true'
      - key: APP_ORIGIN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: OIDC_ISSUER_URL
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
databases:
  - name: forgotten-network-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: forgotten_network
    ipAllowList: []
