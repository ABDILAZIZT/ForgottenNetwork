# Free plans are for short-lived preview only; public data needs durable storage.
services:
  - type: web
    name: forgotten-network
    runtime: node
    branch: main
    autoDeployTrigger: commit
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@11.25.0 && pnpm install --production=false --frozen-lockfile && pnpm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: CI
        value: 'true'
      - key: NODE_ENV
        value: production
      - key: VITE_WORLD_MODE
        value: remote
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: forgotten-network-db
          property: connectionString
      - key: DATABASE_SSL
        # fromDatabase.connectionString uses Render's private network; its TLS cert is self-signed.
        value: 'false'
      - key: MIGRATE_ON_START
        value: 'true'
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: https://forgotten-network.onrender.com
      - key: CORS_ORIGIN
        value: https://forgotten-network.onrender.com
      - key: OIDC_ISSUER_URL
        sync: false
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: REQUEST_LOGS
        value: 'true'
      - key: ADS_ENABLED
        value: 'false'
      - key: VITE_ADS_ENABLED
        value: 'false'
databases:
  - name: forgotten-network-db
    plan: free
    region: frankfurt
    databaseName: forgotten_network
