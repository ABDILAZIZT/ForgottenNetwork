services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forgotten_network
      POSTGRES_USER: forgotten_network
      POSTGRES_PASSWORD: local-development-password
    ports:
      - '5432:5432'
    volumes:
      - forgotten-network-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forgotten_network -d forgotten_network']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forgotten-network-postgres:
